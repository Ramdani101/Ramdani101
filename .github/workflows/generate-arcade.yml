name: Generate Arcade Contribution Game

on:
  schedule:
    # Daily at 18:17 UTC (01:17 WIB)
    - cron: "17 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/generate-arcade.yml"

permissions:
  contents: write

concurrency:
  group: arcade-contribution-graph
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate Galaga contribution animation
        uses: abozanona/pacman-contribution-graph@70945878b1118303b37b88060fc7145e1a57d7b1
        with:
          github_user_name: Ramdani101
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "galaga"
          hide_month_labels: "false"

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
